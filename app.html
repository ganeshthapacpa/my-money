<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3D33">
<meta name="description" content="My Money - personal budgets, goals and debt payoff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Money">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>My Money</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Figtree";src:url(figtree-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url(figtree-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Figtree";src:url(figtree-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Figtree";src:url(figtree-700.woff2) format("woff2");font-weight:700;font-display:swap}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea,.answer{-webkit-user-select:text;user-select:text}
</style>
<style>
/* Layout: single-column phone app, sticky header, scrolling view, fixed bottom tab bar with centered add button; bottom sheets for forms. */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --surface-2:#E7ECE7; --ink:#13201C; --muted:#5D6A65; --line:#DAE1DB;
  --accent:#0E6B57; --accent-ink:#FFFFFF; --accent-soft:#D5EAE2; --hero:#0B3D33; --hero-ink:#EAF5F0; --hero-muted:#A9CFC2; --gold:#F0C35A;
  --good:#1D8657; --warn:#B4741A; --bad:#C2412D; --good-soft:#DDF1E6; --warn-soft:#F7EAD2; --bad-soft:#F8E0DA;
  --shadow:0 1px 2px rgba(19,32,28,.06),0 6px 20px rgba(19,32,28,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1412; --surface:#141F1C; --surface-2:#1C2A26; --ink:#E7EFEB; --muted:#93A39D; --line:#26352F;
  --accent:#43C29C; --accent-ink:#05231B; --accent-soft:#163A31; --hero:#0F3B31; --hero-ink:#EAF5F0; --hero-muted:#9BC9B9; --gold:#F0C35A;
  --good:#4CC38A; --warn:#E3A84B; --bad:#F07A62; --good-soft:#143428; --warn-soft:#3A2D14; --bad-soft:#3D1D16;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1412; --surface:#141F1C; --surface-2:#1C2A26; --ink:#E7EFEB; --muted:#93A39D; --line:#26352F;
  --accent:#43C29C; --accent-ink:#05231B; --accent-soft:#163A31; --hero:#0F3B31; --hero-ink:#EAF5F0; --hero-muted:#9BC9B9; --gold:#F0C35A;
  --good:#4CC38A; --warn:#E3A84B; --bad:#F07A62; --good-soft:#143428; --warn-soft:#3A2D14; --bad-soft:#3D1D16;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:4px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:14px 10px}
header.top h1{font-family:var(--f-display);font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1;min-width:0;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg,.tab svg{width:20px;height:20px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h2,.sec-h{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.005em}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:28px solid rgba(255,255,255,.05)}
.hero .label{color:var(--hero-muted)}
.hero .big{font-family:var(--f-display);font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:6px 0 4px}
.hero .meta{color:var(--hero-muted);font-size:13.5px}
.hero .meta b{color:var(--hero-ink);font-weight:600}
.hero-strip{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip-h{background:rgba(255,255,255,.08);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--hero-ink)}
.chip-h b{color:var(--gold)}

.stat .v{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:4px}
.stat .s{font-size:12.5px;color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)}
.pill{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list>.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.pos{color:var(--good)}
.dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}
.day-h{font-size:12px;font-weight:600;color:var(--muted);padding:14px 2px 4px;display:flex;justify-content:space-between}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.month-sw{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-sw .m{font-family:var(--f-display);font-weight:700;font-size:17px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-block:6px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.tab.on{color:var(--accent)}
.tab.add{justify-self:center}
.tab.add span.fab{width:52px;height:52px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 18px rgba(14,107,87,.35)}
.tab.add span.fab svg{width:24px;height:24px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;min-width:0}
.inp.amount{font-family:var(--f-display);font-size:34px;font-weight:700;text-align:center;padding:10px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}

.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.ai-card{border:1px solid var(--line);background:linear-gradient(160deg,var(--accent-soft),var(--surface) 60%)}
.ai-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--accent)}
.ai-tag svg{width:15px;height:15px}
.insight{padding:10px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0}
.insight b{display:block;font-weight:700}
.answer{white-space:pre-wrap;font-size:14.5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:28px 40px}
.ob .brand{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.02em}
.ob h2{font-family:var(--f-display);font-size:32px;line-height:1.08;margin:0;letter-spacing:-.02em;text-wrap:balance}
.ob p{margin:0;color:var(--muted);max-width:44ch}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.acct-row{display:grid;grid-template-columns:1fr 112px 104px 34px;gap:8px;align-items:center}
.acct-row>*{min-width:0}
.acct-row .inp{padding:9px 10px;font-size:15px}
.x-btn{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center}
.x-btn svg{width:16px;height:16px}
.feature{display:flex;gap:12px;align-items:flex-start}
.feature .fi{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.feature .fi svg{width:19px;height:19px}
.msg{font-size:13.5px;border-radius:10px;padding:9px 11px}.msg.err{background:var(--bad-soft);color:var(--bad)}.msg.ok{background:var(--good-soft);color:var(--good)}
a.brand{text-decoration:none}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin:0 4px 1px 6px}
@media (max-width:420px){.acct-row{grid-template-columns:1fr 96px 34px}.acct-row .typ{grid-column:1/3}.hero .big{font-size:38px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<input type="file" id="receipt-file" accept="image/*" hidden>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>

</body>
</html>
